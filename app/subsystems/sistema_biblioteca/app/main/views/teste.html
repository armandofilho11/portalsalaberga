<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Empréstimos por Mês</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Estilização personalizada para as barras verdes com cantos levemente arredondados no topo */
        .chart-bar {
            background: #008C45;
            border-top-left-radius: 3px;
            border-top-right-radius: 3px;
            width: 14px;
            transition: all 0.3s ease;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-height-screen p-6">

    <div class="bg-white rounded-[20px] p-6 shadow-[0_4px_25px_rgba(0,0,0,0.03)] w-full max-w-[540px]">
        
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-[#1e293b] font-bold text-xl tracking-tight">Empréstimos por Mês</h2>
            
            <button class="flex items-center gap-1.5 border border-[#e2e8f0] rounded-lg px-3 py-1.5 text-xs font-medium text-[#334155] bg-white hover:bg-gray-50 transition">
                Este ano
                <svg class="w-3 h-3 text-[#64748b]" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"></path>
                </svg>
            </button>
        </div>

        <div class="flex gap-3">
            <div class="flex flex-col justify-between text-right text-xs font-medium text-[#94a3b8] h-[160px] w-5 pr-1 select-none">
                <div>40</div>
                <div>30</div>
                <div>20</div>
                <div>10</div>
                <div>0</div>
            </div>

            <div class="flex-1 relative h-[160px]">
                <div class="absolute inset-0 flex flex-col justify-between pointer-events-none">
                    <div class="w-full border-b border-[#f1f5f9]"></div>
                    <div class="w-full border-b border-[#f1f5f9]"></div>
                    <div class="w-full border-b border-[#f1f5f9]"></div>
                    <div class="w-full border-b border-[#f1f5f9]"></div>
                    <div class="w-full border-b border-[#cbd5e1]"></div>
                </div>

                <div class="absolute inset-x-0 bottom-0 h-full flex items-end justify-between px-2">
                    <div class="flex items-end justify-center h-full" style="width: calc(100% / 12);">
                        <div class="chart-bar" style="height: 37.5%;"></div>
                    </div>
                    <div class="flex items-end justify-center h-full" style="width: calc(100% / 12);">
                        <div class="chart-bar" style="height: 55%;"></div>
                    </div>
                    <div class="flex items-end justify-center h-full" style="width: calc(100% / 12);">
                        <div class="chart-bar" style="height: 45%;"></div>
                    </div>
                    <div class="flex items-end justify-center h-full" style="width: calc(100% / 12);">
                        <div class="chart-bar" style="height: 60%;"></div>
                    </div>
                    <div class="flex items-end justify-center h-full" style="width: calc(100% / 12);">
                        <div class="chart-bar" style="height: 47.5%;"></div>
                    </div>
                    <div class="flex items-end justify-center h-full" style="width: calc(100% / 12);">
                        <div class="chart-bar" style="height: 75%;"></div>
                    </div>
                    <div class="flex items-end justify-center h-full" style="width: calc(100% / 12);">
                        <div class="chart-bar" style="height: 67.5%;"></div>
                    </div>
                    <div class="flex items-end justify-center h-full" style="width: calc(100% / 12);">
                        <div class="chart-bar" style="height: 62.5%;"></div>
                    </div>
                    <div class="flex items-end justify-center h-full" style="width: calc(100% / 12);">
                        <div class="chart-bar" style="height: 48.75%;"></div>
                    </div>
                    <div class="flex items-end justify-center h-full" style="width: calc(100% / 12);">
                        <div class="chart-bar" style="height: 40%;"></div>
                    </div>
                    <div class="flex items-end justify-center h-full" style="width: calc(100% / 12);">
                        <div class="chart-bar" style="height: 35%;"></div>
                    </div>
                    <div class="flex items-end justify-center h-full" style="width: calc(100% / 12);">
                        <div class="chart-bar" style="height: 25%;"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="flex gap-3 mt-3">
            <div class="w-5 pr-1"></div> <div class="flex-1 flex justify-between px-2 text-xs font-semibold text-[#64748b] select-none">
                <div class="text-center" style="width: calc(100% / 12);">Jan</div>
                <div class="text-center" style="width: calc(100% / 12);">Fev</div>
                <div class="text-center" style="width: calc(100% / 12);">Mar</div>
                <div class="text-center" style="width: calc(100% / 12);">Abr</div>
                <div class="text-center" style="width: calc(100% / 12);">Mai</div>
                <div class="text-center" style="width: calc(100% / 12);">Jun</div>
                <div class="text-center" style="width: calc(100% / 12);">Jul</div>
                <div class="text-center" style="width: calc(100% / 12);">Ago</div>
                <div class="text-center" style="width: calc(100% / 12);">Set</div>
                <div class="text-center" style="width: calc(100% / 12);">Out</div>
                <div class="text-center" style="width: calc(100% / 12);">Nov</div>
                <div class="text-center" style="width: calc(100% / 12);">Dez</div>
            </div>
        </div>

    </div>

</body>
</html>
