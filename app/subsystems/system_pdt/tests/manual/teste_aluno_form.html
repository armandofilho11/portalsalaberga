<!DOCTYPE html>
<html>
<head>
    <title>Teste de Registro de Aluno</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        .form-group { margin: 15px 0; }
        input, select { width: 100%; max-width: 400px; padding: 8px; }
        button { padding: 10px 20px; background: green; color: white; cursor: pointer; }
        .log { border: 1px solid #ccc; padding: 10px; margin-top: 20px; height: 200px; overflow: auto; font-family: monospace; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>Teste de Registro de Aluno</h1>
    
    <form id="testForm">
        <div class="form-group">
            <label>Nome:</label>
            <input type="text" id="nome" value="Aluno Teste" required>
        </div>
        <div class="form-group">
            <label>Matrícula (7 dígitos):</label>
            <input type="text" id="matricula" value="1234567" maxlength="7" pattern="[0-9]{7}" required>
        </div>
        <div class="form-group">
            <label>Email:</label>
            <input type="email" id="email" value="aluno.teste@example.com" required>
        </div>
        <div class="form-group">
            <label>Turma ID:</label>
            <input type="number" id="turma_id" value="1" required>
        </div>
        <div class="form-group">
            <label>PCD:</label>
            <select id="pcd">
                <option value="nao">Não</option>
                <option value="sim">Sim</option>
            </select>
        </div>
        <button type="submit">Registrar Aluno</button>
    </form>

    <div class="log" id="log"></div>

    <script>
        const log = document.getElementById('log');
        
        function addLog(msg, isError = false) {
            const time = new Date().toLocaleTimeString();
            const classname = isError ? 'error' : 'success';
            log.innerHTML += `<div class="${classname}">[${time}] ${msg}</div>`;
            log.scrollTop = log.scrollHeight;
        }

        document.getElementById('testForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            log.innerHTML = '';
            addLog('🔍 Iniciando teste de registro de aluno...');
            
            const data = {
                nome: document.getElementById('nome').value,
                matricula: document.getElementById('matricula').value,
                email: document.getElementById('email').value,
                turma_id: parseInt(document.getElementById('turma_id').value),
                pcd: document.getElementById('pcd').value,
                rendimento: 0
            };

            addLog(`📤 Enviando dados: ${JSON.stringify(data)}`);

            try {
                const res = await fetch('../../app/main/controllers/aluno_controller.php?action=cadastrar_aluno', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });

                addLog(`📨 Resposta HTTP: ${res.status}`);

                const json = await res.json();
                addLog(`📥 Resposta JSON: ${JSON.stringify(json)}`);

                if (json.sucesso) {
                    addLog(`✅ Aluno registrado com sucesso! ID: ${json.id_aluno}`);
                } else {
                    addLog(`❌ Erro: ${json.erro}`, true);
                }
            } catch (err) {
                addLog(`❌ Erro de conexão: ${err.message}`, true);
            }
        });
    </script>
</body>
</html>
